name: Compute Nitaplast July

on:
  push:
    paths:
      - 'scripts/print-nitaplast-julho.ts'
      - 'src/data/**'
      - '.github/workflows/compute-nitaplast-july.yml'
  workflow_dispatch:

jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compute July result
        run: npx --yes tsx scripts/print-nitaplast-julho.ts
